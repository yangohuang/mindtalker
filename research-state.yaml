    - "local development: bind dev servers to 127.0.0.1 only"
    - "conda env isolation strict — no ~/.local pollution"

# Known fact-checked corrections vs original Phase 2 doc
fact_check_corrections:
  - "FlashHead uses wav2vec2-base-960h (English), NOT chinese-wav2vec2-base"
  - "MiniMind-O ASR is SenseVoice, NOT Whisper"
  - "MiniMind-O training is 4×3090 / 4h (≈16 GPU·h), NOT single-3090 / 2h"
  - "FlashHead expects 25fps × 12 layers × 768D (already aligned by linear_interpolation BEFORE transformer encoder), NOT 50Hz raw"
  - "FlashHead AudioProjModel is flatten+Linear (5×12×768 → 46080-dim → 512), NOT cross-attention; cross-attention happens in DiT block"
  - "audio_window=5 is bidirectional ±2 frames in training — autoregressive inference needs 80ms padding/delay"
